# VoiaX - Docker Kurulum (Tüm Modüller)

version: '3'
services:
  # VoiaX Sunucu
  xiaozhi-esp32-server:
    build:
      context: /home/mehmetakifersoy/xiaozhi_backend/xiaozhi-esp32-server
      dockerfile: Dockerfile-server
    container_name: xiaozhi-esp32-server
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: always
    networks:
      - default
    ports:
      # WebSocket sunucu
      - "8000:8000"
      # HTTP port (OTA + görsel analiz)
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Europe/Istanbul
      - PYTHONIOENCODING=utf-8
    volumes:
      # Yapılandırma dosyaları
      - ./data:/opt/xiaozhi-esp32-server/data
      # Model dosyası (dizin olarak mount edilirse hata verir, kapalı)
      # - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt

  # VoiaX Web Panel (manager-api + manager-web)
  xiaozhi-esp32-server-web:
    build:
      context: /home/mehmetakifersoy/xiaozhi_backend/xiaozhi-esp32-server
      dockerfile: Dockerfile-web
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # VoiaX Kontrol Paneli
      - "8002:8002"
    environment:
      - TZ=Europe/Istanbul
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Istanbul&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      # Yükleme dosyaları
      - ./uploadfile:/uploadfile
  # Veritabanı (MySQL)
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Europe/Istanbul
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # Redis (Önbellek)
  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
networks:
  default:
